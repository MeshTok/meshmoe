# ============================================================================
# MeshMoe 本地模型接入 DSH 的 patch 覆盖层
# 模型: MeshMoe-4B (基于 TokenRhythm/NeoHorse-1-4B, Qwen3.5-4B 后训练, Apache-2.0)
# 用法: dsh headless --patch meshmoe-patch.yml "任务..."
# ============================================================================
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      meshmoe-local:
        displayName: MeshMoe (Local)
        api: openai-completions
        baseURL: http://127.0.0.1:8081/v1
        apiKeyEnv: MESHMOE_LOCAL_KEY   # 本地服务不校验; 任意非空值即可
        compat:
          thinkingFormat: deepseek     # 解析 reasoning_content 字段
        models:
          - id: meshmoe-4b
            name: MeshMoe-4B (Q4_K_M)
            reasoning: false
            input: ['text']
            contextWindow: 32768
            maxTokens: 8192
            cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: meshmoe-local
    model: meshmoe-4b
