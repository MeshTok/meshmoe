# ============================================================================
# dsh-meshmoe bundle patch
# 挂载两件事:
#   1. 向 llm-pi-ai 注册 meshmoe-local 本地模型路由 (keyless, 免注册)
#   2. 把默认模型切到 meshmoe-local/meshmoe-4b
# 模型: MeshMoe-4B (基于 TokenRhythm/NeoHorse-1-4B, Qwen3.5-4B 后训练, Apache-2.0)
# 注意: patch entry 是整块替换 —— 用户后续在 GUI 加的其它 provider 会被
#       本补丁覆盖。v1 版本将改为运行时合并 (host 代码读现有 config 再写回)。
# ============================================================================
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      meshmoe-local:
        displayName: MeshMoe (Local)
        api: openai-completions
        baseURL: http://127.0.0.1:8081/v1
        apiKeyEnv: MESHMOE_LOCAL_KEY
        compat:
          thinkingFormat: deepseek
        models:
          - id: meshmoe-4b
            name: MeshMoe-4B (Q4_K_M)
            reasoning: false
            input: ['text']
            contextWindow: 32768
            maxTokens: 8192
            cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: meshmoe-local
    model: meshmoe-4b
